<!doctype html>
<html lang="en">
<head>

  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#1d164d; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; }
    body { min-height:100svh; background:#edf0ff url('./background.png') center center / cover no-repeat fixed; }
    body::before { content:""; position:fixed; inset:0; background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.08) 45%,rgba(234,232,255,.20)); pointer-events:none; }
    main { position:relative; min-height:100svh; display:flex; align-items:center; justify-content:center; padding:32px 18px; }
    .panel { width:min(100%, 560px); padding:clamp(25px,5vw,45px); text-align:center; background:rgba(255,255,255,.52); border:1px solid rgba(255,255,255,.76); border-radius:30px; box-shadow:0 18px 70px rgba(69,49,139,.13); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
    .eyebrow { font-size:11px; font-weight:800; letter-spacing:.33em; color:#6e5bb1; margin:0 0 12px; }
    h1 { font-size:clamp(38px,8vw,64px); letter-spacing:-.055em; line-height:1; margin:0; font-weight:900; color:#24145e; }
    .subtitle { margin:14px 0 30px; font-size:14px; font-weight:600; color:#64568b; letter-spacing:.055em; }
    .ca-label { display:block; margin-bottom:10px; text-align:left; font-size:11px; font-weight:800; letter-spacing:.18em; color:#6d5b9d; }
    .ca-box { display:flex; align-items:center; gap:9px; border-radius:15px; background:rgba(255,255,255,.78); border:1px solid rgba(127,108,200,.25); padding:10px 11px 10px 16px; min-height:57px; }
    .ca-box span { flex:1; min-width:0; text-align:left; font-size:14px; color:#8a80a7; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .copy { border:0; border-radius:10px; padding:10px 13px; color:#fff; font-weight:800; background:linear-gradient(135deg,#8063ef,#ae5ee6); cursor:pointer; }
    .copy:disabled { opacity:.45; cursor:not-allowed; }
    .socials { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:16px; }
    .social { min-height:74px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; border:1px solid rgba(129,107,205,.22); border-radius:15px; background:rgba(255,255,255,.75); color:#302269; text-decoration:none; font-size:11px; font-weight:800; transition:transform .2s,background .2s; }
    a.social:hover { transform:translateY(-3px); background:white; }
    .social svg { width:24px; height:24px; fill:currentColor; }
    .social.disabled { opacity:.58; cursor:default; }
    .footer { font-size:11px; color:#71668f; margin:24px 0 0; }
    @media(max-width:600px) { body { background-attachment:scroll; background-position:center center; } main { padding:18px; } .panel { border-radius:24px; padding:28px 19px; } .socials { gap:7px; } .social { min-height:68px; font-size:10px; } .subtitle { margin-bottom:25px; } }
  </style>
